name: Container Build Push
description: Build a container and optionally push it to a caller-selected registry
inputs:
  tag:
    description: Container image tag to build
    required: true
  version:
    description: Packaged application version for OCI metadata
    required: true
  registry:
    description: OCI registry host
    required: false
    default: ghcr.io
  image-repository:
    description: Image repository below the registry; defaults to github.repository
    required: false
    default: ''
  component:
    description: Optional component appended to the image repository
    required: false
    default: ''
  push:
    description: Whether to publish the built image to the registry
    required: false
    default: 'true'
  username:
    description: Registry username; required with password when push is true, otherwise optional only as a complete pair
    required: false
    default: ''
  password:
    description: Registry password or token; required with username when push is true, otherwise optional only as a complete pair
    required: false
    default: ''
  working-directory:
    description: Docker build context relative to the checkout
    required: false
    default: .
  auth-token:
    description: Optional BuildKit secret named auth-token
    required: false
    default: ''
  build-contexts:
    description: Additional named Docker build contexts
    required: false
    default: ''
  build-args:
    description: Optional build arguments forwarded unchanged to Docker Buildx
    required: false
    default: ''
  cache-from:
    description: Optional newline-delimited external cache sources forwarded unchanged to Docker Buildx
    required: false
    default: ''
  cache-to:
    description: Optional newline-delimited external cache destinations forwarded unchanged to Docker Buildx
    required: false
    default: ''
outputs:
  image-reference:
    description: Normalized image reference built by the action
    value: ${{ steps.prepare.outputs.image-reference }}
  image-digest:
    description: Published registry digest; empty for a build with push disabled
    value: ${{ inputs.push == 'true' && (steps.probe.outputs.image-digest || steps.publish.outputs.digest) || '' }}
runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: prepare
      name: Prepare image build
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        SOURCE_REPOSITORY: ${{ github.repository }}
        SOURCE_REVISION: ${{ github.sha }}
        SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_ACTION: ${{ github.action }}
      run: '& "$env:ACTION_PATH/prepare-build.ps1"'
    - name: Log in to container registry
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - id: probe
      name: Inspect exact image reference
      if: inputs.push == 'true'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        IMAGE_REFERENCE: ${{ steps.prepare.outputs.image-reference }}
      run: '& "$env:ACTION_PATH/probe-image.ps1"'
    - id: buildx
      name: Set up Docker Buildx
      if: inputs.push != 'true' || steps.probe.outputs.exists != 'true'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - id: build
      name: Build image without publishing
      if: inputs.push != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.working-directory }}
        build-contexts: ${{ inputs.build-contexts }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        secrets: ${{ inputs.auth-token != '' && format('auth-token={0}', inputs.auth-token) || '' }}
        pull: true
        push: false
        tags: ${{ steps.prepare.outputs.image-reference }}
        labels: ${{ steps.prepare.outputs.labels }}
    - name: Build local image for metadata inspection
      if: inputs.push == 'true' && steps.probe.outputs.exists != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.working-directory }}
        build-contexts: ${{ inputs.build-contexts }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        secrets: ${{ inputs.auth-token != '' && format('auth-token={0}', inputs.auth-token) || '' }}
        pull: true
        load: true
        push: false
        provenance: false
        tags: ${{ steps.prepare.outputs.inspection-reference }}
        labels: ${{ steps.prepare.outputs.labels }}
    - id: inspect
      name: Read labels from local image configuration
      if: inputs.push == 'true' && steps.probe.outputs.exists != 'true'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INSPECTION_REFERENCE: ${{ steps.prepare.outputs.inspection-reference }}
      run: '& "$env:ACTION_PATH/inspect-image.ps1"'
    - id: publish
      name: Rebuild and publish annotated image
      if: inputs.push == 'true' && steps.probe.outputs.exists != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.working-directory }}
        build-contexts: ${{ inputs.build-contexts }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        secrets: ${{ inputs.auth-token != '' && format('auth-token={0}', inputs.auth-token) || '' }}
        pull: true
        push: true
        provenance: mode=min,oci-artifact=true
        tags: ${{ steps.prepare.outputs.image-reference }}
        labels: ${{ steps.prepare.outputs.labels }}
        annotations: ${{ steps.inspect.outputs.annotations }}
    - name: Verify published image metadata
      if: inputs.push == 'true' && steps.probe.outputs.exists != 'true'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        IMAGE_REFERENCE: ${{ steps.prepare.outputs.image-reference }}
        LABEL_SNAPSHOT: ${{ steps.inspect.outputs.label-snapshot }}
      run: '& "$env:ACTION_PATH/verify-image.ps1"'
    - name: Remove local metadata inspection image
      if: always() && inputs.push == 'true' && steps.probe.outputs.exists != 'true'
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INSPECTION_REFERENCE: ${{ steps.prepare.outputs.inspection-reference }}
      run: '& "$env:ACTION_PATH/cleanup-image.ps1"'
