name: Helm Deployment State
description: Read the deployed chart dependency version and image tag from a wrapper chart
inputs:
  token:
    description: Token with contents read permission for the target repository
    required: true
  environment:
    description: Environment whose wrapper chart state is being read
    required: true
  chart-name:
    description: Name of the chart whose deployment state is being read
    required: true
  dependency:
    description: Dependency name or alias to read; defaults to chart-name
    required: false
    default: ''
  target-repository:
    description: GitHub owner/repository containing the wrapper chart
    required: false
    default: SayakMukhopadhyay/k8s-landscape-charts
  target-ref:
    description: Git ref to read in the target repository
    required: false
    default: main
  wrapper-chart-path:
    description: Wrapper chart path; defaults to chart-name/envs/environment
    required: false
    default: ''
outputs:
  dependency-version:
    description: Version of the selected Helm dependency
    value: ${{ steps.state.outputs.dependency-version }}
  image-tag:
    description: Image tag under the selected dependency values root
    value: ${{ steps.state.outputs.image-tag }}
  chart-source-ref:
    description: Full development commit SHA or stable chart-v<version> source ref
    value: ${{ steps.state.outputs.chart-source-ref }}
runs:
  using: composite
  steps:
    - name: Checkout target charts repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.target-repository }}
        ref: ${{ inputs.target-ref }}
        path: .helm-deployment-state
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: false
        token: ${{ inputs.token }}
    - id: state
      name: Read wrapper deployment state
      uses: $/actions/helm-deployment-state
      with:
        checkout-path: .helm-deployment-state
        environment: ${{ inputs.environment }}
        chart-name: ${{ inputs.chart-name }}
        dependency: ${{ inputs.dependency }}
        wrapper-chart-path: ${{ inputs.wrapper-chart-path }}
