name: Promote v1

on:
  workflow_dispatch:
    inputs:
      target-sha:
        description: Full commit SHA from main to promote or roll back to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-v1
  cancel-in-progress: false

jobs:
  promote:
    name: Move v1 tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # zizmor: ignore[artipacked] required only for the immediate tag push

      - name: Validate target and move v1
        env:
          INPUT_TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail

          [[ $INPUT_TARGET_SHA =~ ^[0-9a-fA-F]{40}$ ]] || {
            printf 'target-sha must be a full 40-character commit SHA.\n' >&2
            exit 1
          }

          target_sha=$(git rev-parse --verify "$INPUT_TARGET_SHA^{commit}")
          [[ "${target_sha,,}" == "${INPUT_TARGET_SHA,,}" ]] || {
            printf 'target-sha does not resolve to the supplied commit.\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "$target_sha" origin/main || {
            printf 'Target %s is not reachable from origin/main.\n' "$target_sha" >&2
            exit 1
          }

          current_v1=$(git rev-parse --verify refs/tags/v1)
          git tag --force v1 "$target_sha"
          git push origin refs/tags/v1:refs/tags/v1 \
            "--force-with-lease=refs/tags/v1:$current_v1"
