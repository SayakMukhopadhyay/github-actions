name: Install Verified Argo CD CLI
description: Internal checksum-verified Argo CD CLI installation for argocd-verify-deployment
inputs:
  runner-temp:
    description: Runner temporary directory used for the pinned Argo CD CLI
    required: true
outputs:
  cli-path:
    description: Absolute path to the verified Argo CD CLI
runs:
  using: node24
  main: dist/index.mjs
