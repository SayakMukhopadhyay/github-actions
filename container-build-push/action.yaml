name: Container Build Push
description: Build a container and optionally push it to a caller-selected registry
inputs:
  version:
    description: Version of the container
    required: true
  component:
    description: Optional component appended to the image repository
    required: false
    default: ''
  push:
    description: Push the container to the registry
    required: false
    default: 'true'
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password or token
    required: false
    default: ''
  auth-token:
    description: Optional BuildKit secret named auth-token
    required: false
    default: ''
  working-directory:
    description: Docker build context relative to the checkout
    required: false
    default: .
  build-contexts:
    description: Additional named Docker build contexts
    required: false
    default: ''
  registry:
    description: Container registry host
    required: false
    default: ghcr.io
  image-repository:
    description: Image repository below the registry; defaults to github.repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: prepare
      name: Prepare image build
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        SOURCE_REPOSITORY: ${{ github.repository }}
      run: 'bash "$ACTION_PATH/prepare.sh"'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Log in to container registry
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Build and optionally push image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.working-directory }}
        build-contexts: ${{ inputs.build-contexts }}
        secrets: |
          auth-token=${{ inputs.auth-token }}
        pull: true
        push: ${{ inputs.push }}
        tags: ${{ steps.prepare.outputs.image-reference }}
        labels: |
          org.opencontainers.image.created=${{ steps.prepare.outputs.created }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
