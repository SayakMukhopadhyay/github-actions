name: Generate Release Notes
description: Generate and deterministically render validated release notes
inputs:
  openai-wif-audience:
    description: Audience configured on the OpenAI workload identity provider
    required: true
  openai-identity-provider-id:
    description: OpenAI workload identity provider identifier
    required: true
  openai-service-account-id:
    description: OpenAI service account identifier used by workload identity federation
    required: true
  context-file:
    description: Secret-free bounded repository context file
    required: true
  facts-file:
    description: Secret-free authoritative Git release facts file
    required: true
  body-file:
    description: New file to receive the rendered release body
    required: true
runs:
  using: node24
  main: dist/index.mjs
