name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      attestations: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bootstrap locked dependencies and tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run bootstrap

      - name: Validate source, tests, policies, and generated artifacts
        shell: pwsh
        run: npm run validate

      - name: Require a clean validated tree
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($status) {
            git status --short --untracked-files=all
            throw 'Validation changed the tree. Commit every generated artifact.'
          }

  security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: 1.30.0
          online-audits: false
          advanced-security: false
          annotations: true

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'

      - name: Set up Licensed
        uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 5.1.0

      - name: Check cached dependency licenses
        shell: pwsh
        run: licensed status

  action-level:
    name: Credential-free action fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout fixture Go dependencies
        uses: $/checkout-dependencies
        with:
          working-directory: tests/fixtures/go-chart
          go-version: '1.27'
          node-version-file: .nvmrc

      - name: Validate static site fixture
        uses: $/validate-static-site
        with:
          path: tests/fixtures/static-site

      - name: Validate fixture versions
        uses: $/check-version
        with:
          working-directory: tests/fixtures/go-chart
          helm: 'true'

      - name: Build fixture container
        uses: $/container-build-push
        with:
          version: ci
          working-directory: tests/fixtures/go-chart
          build-contexts: |
            fixture=tests/fixtures/go-chart
            secondary=tests/fixtures/go-chart
          build-args: |
            VERSION=fixture-version
            COMMIT=fixture-commit
          cache-from: |
            type=gha,scope=github-actions-container-fixture
          cache-to: |
            type=gha,mode=max,scope=github-actions-container-fixture
          push: 'false'

      - name: Package fixture chart
        uses: $/helm-package-push
        with:
          working-directory: tests/fixtures/go-chart
          development: 'false'
          push: 'false'
