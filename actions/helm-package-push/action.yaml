name: Prepare Helm Package
description: Internal metadata preparation for the public helm-package-push composite action
inputs:
  development:
    description: Whether to create version 0.0.0-build-<full lowercase commit SHA>
    required: true
  working-directory:
    description: Working directory of the project
    required: true
  source-revision:
    description: Source revision used for development chart versions
    required: true
outputs:
  chart-directory:
    description: Canonical path to the chart directory
  chart-name:
    description: Name declared by Chart.yaml
  chart-version:
    description: Stable charts/VERSION or 0.0.0-build-<full lowercase commit SHA>
  repositories-file:
    description: NUL-delimited HTTP dependency repository records for the Helm transaction
runs:
  using: node24
  main: dist/index.mjs
