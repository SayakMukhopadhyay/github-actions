name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Source, generated artifacts, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Checkout Bats
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
          path: .tools/bats
          persist-credentials: false

      - name: Add Bats to PATH
        run: echo "$GITHUB_WORKSPACE/.tools/bats/bin" >>"$GITHUB_PATH"

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run pure Node.js tests
        run: npm run test:node

      - name: Run shell integration tests
        run: npm run test:shell

      - name: Regenerate consumer action schema
        run: npm run schema:generate

      - name: Reject consumer schema drift
        run: git diff --exit-code -- schemas/action-inputs.schema.json

      - name: Extract released v1 contracts
        run: bash tooling/extract-v1-contracts.sh "$RUNNER_TEMP/v1-actions"

      - name: Check public v1 compatibility
        run: npm run contracts:check -- "$RUNNER_TEMP/v1-actions"

      - name: Rebuild ESM action bundles
        run: npm run bundle

      - name: Reject action bundle drift
        run: >-
          git diff --exit-code --
          check-version/dist
          actions/is-file-changed/dist
          actions/bump-version/dist
          actions/helm-package-push/dist
          actions/create-release/dist

      - name: Smoke-check ESM action bundles
        run: |
          node --check check-version/dist/index.mjs
          node --check actions/is-file-changed/dist/index.mjs
          node --check actions/bump-version/dist/index.mjs
          node --check actions/helm-package-push/dist/index.mjs
          node --check actions/create-release/dist/index.mjs

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: bash scripts/install-shellcheck.sh

      - name: Lint shell scripts
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './.tools/*' \
              -not -path './node_modules/*' \
              -print0
          )
          shellcheck --external-sources --source-path=SCRIPTDIR "${shell_files[@]}"

      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: bash tooling/install-actionlint.sh "$RUNNER_TEMP/actionlint-bin"

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint"'

      - name: Require a clean validated tree
        run: |
          if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
            git status --short --untracked-files=all
            printf 'Validation changed the tree. Commit every generated artifact.\n' >&2
            exit 1
          fi

  security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: 1.30.0
          online-audits: false
          advanced-security: false
          annotations: true

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'

      - name: Set up Licensed
        uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 5.1.0

      - name: Check cached dependency licenses
        run: licensed status

  action-level:
    name: Credential-free action fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout fixture Go dependencies
        uses: ./checkout-dependencies
        with:
          working-directory: tests/fixtures/go-chart
          go-version: '1.27'

      - name: Validate fixture versions
        uses: ./check-version
        with:
          working-directory: tests/fixtures/go-chart
          helm: 'true'

      - name: Build fixture container
        uses: ./container-build-push
        with:
          version: ci
          working-directory: tests/fixtures/go-chart
          build-args: |
            VERSION=fixture-version
            COMMIT=fixture-commit
          push: 'false'

      - name: Package fixture chart
        uses: ./helm-package-push
        with:
          working-directory: tests/fixtures/go-chart
          development: 'false'
          push: 'false'
