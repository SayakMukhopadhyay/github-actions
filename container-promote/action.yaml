name: Container Promote
description: Create one tag for an existing container image digest
inputs:
  source-digest:
    description: Published sha256 image digest to promote
    required: true
  tag:
    description: Target container tag to create
    required: true
  component:
    description: Optional component appended to the image repository
    required: false
    default: ''
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password or token
    required: false
    default: ''
  registry:
    description: Container registry host
    required: false
    default: ghcr.io
  image-repository:
    description: Image repository below the registry; defaults to github.repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: prepare
      name: Prepare image promotion
      shell: bash
      env:
        INPUT_SOURCE_DIGEST: ${{ inputs.source-digest }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        SOURCE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        source_digest=${INPUT_SOURCE_DIGEST:?source-digest is required}
        tag=${INPUT_TAG:?tag is required}
        component=${INPUT_COMPONENT:-}
        registry=${INPUT_REGISTRY:-ghcr.io}
        repository=${INPUT_IMAGE_REPOSITORY:-}
        [[ -n "$repository" ]] || repository=${SOURCE_REPOSITORY:?github.repository is required}

        for value in "$source_digest" "$tag" "$component" "$registry" "$repository"; do
          if [[ $value =~ [[:cntrl:]] ]]; then
            echo 'Container image inputs must not contain control characters' >&2
            exit 1
          fi
        done

        registry=${registry,,}
        repository=${repository,,}
        component=${component,,}
        registry_pattern='^([a-z0-9]|[a-z0-9][a-z0-9-]*[a-z0-9])(\.([a-z0-9]|[a-z0-9][a-z0-9-]*[a-z0-9]))*(:[0-9]+)?$'
        path_pattern='^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$'
        tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
        digest_pattern='^sha256:[0-9a-f]{64}$'
        [[ $registry =~ $registry_pattern ]] || { echo 'Invalid container registry' >&2; exit 1; }
        [[ $repository =~ $path_pattern ]] || { echo 'Invalid image repository' >&2; exit 1; }
        [[ -z $component || $component =~ $path_pattern ]] || { echo 'Invalid image component' >&2; exit 1; }
        [[ $source_digest =~ $digest_pattern ]] || { echo 'Invalid source image digest' >&2; exit 1; }
        [[ $tag =~ $tag_pattern ]] || { echo 'Invalid target container tag' >&2; exit 1; }

        image_name="$registry/$repository"
        [[ -z "$component" ]] || image_name="$image_name/$component"
        printf 'source-reference=%s@%s\n' "$image_name" "$source_digest" >>"$GITHUB_OUTPUT"
        printf 'target-reference=%s:%s\n' "$image_name" "$tag" >>"$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Log in to container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Create target image tag
      shell: bash
      env:
        SOURCE_REFERENCE: ${{ steps.prepare.outputs.source-reference }}
        TARGET_REFERENCE: ${{ steps.prepare.outputs.target-reference }}
      run: |
        set -euo pipefail
        docker buildx imagetools create --prefer-index=false \
          --tag "$TARGET_REFERENCE" \
          "$SOURCE_REFERENCE"
