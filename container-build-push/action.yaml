name: Container Build Push
description: Build a container and optionally push it to a caller-selected registry
inputs:
  version:
    description: Version of the container
    required: true
  component:
    description: Optional component appended to the image repository
    required: false
    default: ''
  push:
    description: Push the container to the registry
    required: false
    default: 'true'
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password or token
    required: false
    default: ''
  auth-token:
    description: Optional BuildKit secret named auth-token
    required: false
    default: ''
  working-directory:
    description: Docker build context relative to the checkout
    required: false
    default: .
  build-contexts:
    description: Additional named Docker build contexts
    required: false
    default: ''
  build-args:
    description: Optional build arguments forwarded unchanged to Docker Buildx
    required: false
    default: ''
  registry:
    description: Container registry host
    required: false
    default: ghcr.io
  image-repository:
    description: Image repository below the registry; defaults to github.repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: prepare
      name: Prepare image build
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        SOURCE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        version=${INPUT_VERSION:?version is required}
        component=${INPUT_COMPONENT:-}
        registry=${INPUT_REGISTRY:-ghcr.io}
        repository=${INPUT_IMAGE_REPOSITORY:-}
        [[ -n "$repository" ]] || repository=${SOURCE_REPOSITORY:?github.repository is required}

        for value in "$version" "$component" "$registry" "$repository"; do
          if [[ $value =~ [[:cntrl:]] ]]; then
            echo 'Container image inputs must not contain control characters' >&2
            exit 1
          fi
        done

        registry=${registry,,}
        repository=${repository,,}
        component=${component,,}
        # Environment variables cannot represent NUL. Reject every other control byte before
        # emitting the line-oriented GitHub output protocol.
        registry_pattern='^([a-z0-9]|[a-z0-9][a-z0-9-]*[a-z0-9])(\.([a-z0-9]|[a-z0-9][a-z0-9-]*[a-z0-9]))*(:[0-9]+)?$'
        path_pattern='^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$'
        tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
        [[ $registry =~ $registry_pattern ]] || { echo 'Invalid container registry' >&2; exit 1; }
        [[ $repository =~ $path_pattern ]] || { echo 'Invalid image repository' >&2; exit 1; }
        [[ -z $component || $component =~ $path_pattern ]] || { echo 'Invalid image component' >&2; exit 1; }
        [[ $version =~ $tag_pattern ]] || { echo 'Invalid container version tag' >&2; exit 1; }

        image_name="${registry,,}/${repository,,}"
        [[ -z "$component" ]] || image_name="$image_name/${component,,}"
        printf 'image-reference=%s:%s\n' "$image_name" "$version" >>"$GITHUB_OUTPUT"
        printf 'created=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Log in to container registry
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Build and optionally push image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.working-directory }}
        build-contexts: ${{ inputs.build-contexts }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.auth-token != '' && format('auth-token={0}', inputs.auth-token) || '' }}
        pull: true
        push: ${{ inputs.push }}
        tags: ${{ steps.prepare.outputs.image-reference }}
        labels: |
          org.opencontainers.image.created=${{ steps.prepare.outputs.created }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
