name: Release Tags
description: Check for, verify, or atomically ensure release tags
inputs:
  token:
    description: GitHub token with contents read permission, plus contents write permission in ensure mode
    required: true
  tags:
    description: Newline-delimited Git tag names
    required: true
  mode:
    description: exists to check presence, verify to check the caller commit, or ensure to create missing tags
    required: false
    default: verify
outputs:
  tags-exist:
    description: Whether every requested tag exists, regardless of its target
    value: ${{ steps.tags.outputs.tags-exist }}
  tags-match:
    description: Whether every requested tag resolves to the caller commit in verify or ensure mode
    value: ${{ steps.tags.outputs.tags-match }}
runs:
  using: composite
  steps:
    - name: Check out the caller commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: false
        token: ${{ inputs.token }}

    - id: tags
      name: Check, verify, or ensure release tags
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_TOKEN: ${{ inputs.token }}
        TARGET_SHA: ${{ github.sha }}
      run: 'bash "$ACTION_PATH/release-tags.sh"'
