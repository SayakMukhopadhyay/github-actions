name: Promote v1

on:
  workflow_dispatch:
    inputs:
      target-sha:
        description: Full commit SHA from main to promote or roll back to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-v1
  cancel-in-progress: false

jobs:
  promote:
    name: Move v1 tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # zizmor: ignore[artipacked] required only for the immediate tag push

      - name: Validate target and move v1
        shell: pwsh
        env:
          INPUT_TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'target-sha must be a full 40-character commit SHA.' }
          $targetSha = git rev-parse --verify "$env:INPUT_TARGET_SHA`^{commit}"
          if ($LASTEXITCODE -ne 0 -or $targetSha.ToLowerInvariant() -ne $env:INPUT_TARGET_SHA.ToLowerInvariant()) { throw 'target-sha does not resolve to the supplied commit.' }
          git merge-base --is-ancestor $targetSha origin/main
          if ($LASTEXITCODE -ne 0) { throw "Target $targetSha is not reachable from origin/main." }
          $currentV1 = git rev-parse --verify refs/tags/v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git tag --force v1 $targetSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin refs/tags/v1:refs/tags/v1 "--force-with-lease=refs/tags/v1:$currentV1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
