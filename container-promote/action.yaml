name: Container Promote
description: Create one tag for an existing container image digest
inputs:
  source-digest:
    description: Published sha256 image digest to promote
    required: true
  tag:
    description: Target container tag to create
    required: true
  component:
    description: Optional component appended to the image repository
    required: false
    default: ''
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password or token
    required: false
    default: ''
  registry:
    description: Container registry host
    required: false
    default: ghcr.io
  image-repository:
    description: Image repository below the registry; defaults to github.repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: prepare
      name: Prepare image promotion
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SOURCE_DIGEST: ${{ inputs.source-digest }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        SOURCE_REPOSITORY: ${{ github.repository }}
      run: '& "$env:ACTION_PATH/prepare-promotion.ps1"'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Log in to container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Create target image tag
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE_REFERENCE: ${{ steps.prepare.outputs.source-reference }}
        TARGET_REFERENCE: ${{ steps.prepare.outputs.target-reference }}
      run: '& "$env:ACTION_PATH/promote.ps1"'
