name: Chart Update Deploy
description: Update Helm dependency and image state in the personal GitOps repository or a caller-selected override
inputs:
  token:
    description: Token with contents write permission for the target repository
    required: true
  environment:
    description: Environment whose wrapper chart is being promoted
    required: true
  chart-name:
    description: Name of the chart being deployed
    required: true
  chart-version:
    description: Optional version of the chart dependency to deploy; image-tag is required when omitted
    required: false
    default: ''
  image-tag:
    description: Optional image tag to set under the selected dependency values root; chart-version is required when omitted
    required: false
    default: ''
  dependency:
    description: Name or alias of the dependency to update; defaults to chart-name
    required: false
    default: ''
  target-repository:
    description: GitHub owner/repository containing the wrapper chart
    required: false
    default: SayakMukhopadhyay/k8s-landscape-charts
  target-ref:
    description: Branch to update in the target repository
    required: false
    default: main
  wrapper-chart-path:
    description: Wrapper chart path; defaults to chart-name/envs/environment
    required: false
    default: ''
  registry:
    description: Optional OCI registry host; credentials are required when provided
    required: false
    default: ''
  username:
    description: OCI registry username; required with password when registry is provided and forbidden otherwise
    required: false
    default: ''
  password:
    description: OCI registry password or token; required with username when registry is provided and forbidden otherwise
    required: false
    default: ''
outputs:
  commit-sha:
    description: Resulting target GitOps commit SHA, or the current target HEAD for a no-op
    value: ${{ steps.update.outputs.commit-sha }}
runs:
  using: composite
  steps:
    - name: Checkout target charts repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.target-repository }}
        ref: ${{ inputs.target-ref }}
        path: .gitops-charts
        fetch-depth: 0
        fetch-tags: false
        # Credentials are required by this action's immediate focused push.
        persist-credentials: true # zizmor: ignore[artipacked] intentional
        token: ${{ inputs.token }}
    - name: Validate registry credentials
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        REGISTRY_CREDENTIAL_REQUIREMENT: ${{ inputs.registry != '' && 'Required' || 'Forbidden' }}
      run: '& "$env:ACTION_PATH/../powershell/validate-registry-credentials.ps1"'
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.2.4
    - name: Log in to OCI registry
      if: inputs.registry != ''
      shell: pwsh
      env:
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
      run: '$env:PASSWORD | helm registry login $env:REGISTRY --username $env:USERNAME --password-stdin'
    - id: update
      name: Update and push wrapper state
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_CHECKOUT_PATH: .gitops-charts
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_CHART_NAME: ${{ inputs.chart-name }}
        INPUT_CHART_VERSION: ${{ inputs.chart-version }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        INPUT_DEPENDENCY: ${{ inputs.dependency }}
        INPUT_TARGET_REF: ${{ inputs.target-ref }}
        INPUT_WRAPPER_CHART_PATH: ${{ inputs.wrapper-chart-path }}
      run: '& "$env:ACTION_PATH/chart-update-deploy.ps1"'
