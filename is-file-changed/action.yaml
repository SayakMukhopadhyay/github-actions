name: Is File Changed
description: Detect a path pattern across the complete Git push range
inputs:
  pattern:
    description: JavaScript regular expression matched against changed repository paths
    required: true
  token:
    description: Token used to checkout and fetch the repository
    required: false
    default: ${{ github.token }}
outputs:
  changed:
    description: Whether any changed path matched the pattern
    value: ${{ steps.match.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Validate push range
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.after }}
      run: 'bash "$ACTION_PATH/collect-changed-files.sh" validate'
    - name: Checkout repository history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.after }}
        fetch-depth: 0
        fetch-tags: false
        # Credentials are retained only so an orphaned force-push endpoint can be fetched.
        persist-credentials: true # zizmor: ignore[artipacked] intentional
        token: ${{ inputs.token }}
    - id: detect
      name: Collect changed paths
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.after }}
      run: 'bash "$ACTION_PATH/collect-changed-files.sh" collect'
    - id: match
      name: Detect changed paths
      uses: $/actions/is-file-changed
      with:
        pattern: ${{ inputs.pattern }}
        changed-files: ${{ steps.detect.outputs.changed-files }}
